name: Build Essays

# Run this workflow whenever an essay changes.
on:
  push:
    paths:
      - "essay-template.html"   # Rebuild if the essay template changes.
      - "build-essays.py"       # Rebuild if the build script changes.
      - "essays-source/**"      # Rebuild if any essay source file changes.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build essays
        run: python build-essays.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only the generated essay pages are committed.
          # library.html is now maintained by hand.
          git add essays

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automatically rebuild essays"
            git push
          fi
