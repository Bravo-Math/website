name: Build Essays

# Automatically rebuild the published essay pages whenever the essay
# template, build script, or essay source files change.
on:
  push:
    paths:
      - "essay-template.html"   # Rebuild if the essay template changes.
      - "build-essays.py"       # Rebuild if the build script changes.
      - "essays-source/**"      # Rebuild if any essay source file changes.
      - ".github/workflows/build-essays.yml" # Rebuild if workflow changes.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build published essay pages
        run: python build-essays.py

      - name: Commit generated essay pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only the generated essay pages are committed.
          # library.html is maintained manually and is never modified
          # by this workflow.
          git add essays

          if git diff --cached --quiet; then
            echo "No generated essay pages changed."
          else
            git commit -m "Automatically rebuild essay pages"
            git push
          fi
